<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ricky&Meli Love Page</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --pink: #ff4d6d;
            --dark: #1a1a1a;
            --bg: #fff5f7;
            --glass: rgba(255, 255, 255, 0.7);
            --sunflower: #ffb700;
        }

        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 20px 0; min-height: 100vh;
            background: linear-gradient(-45deg, #fff5f7, #ffe0e9, #fff5f7, #ffccd5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            width: 100%; overflow-x: hidden;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        h1 { color: var(--pink); font-size: 2rem; text-align: center; margin: 20px 0; font-weight: 900; z-index: 10; }

        /* --- DASHBOARD --- */
        .dashboard { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; 
            width: 95%; max-width: 500px; z-index: 10; margin: 0 auto;
        }
        .heart-clock { 
            position: relative; aspect-ratio: 1/1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; animation: heartbeat 3s ease-in-out infinite; 
        }
        .heart-shape { position: absolute; width: 100%; height: 100%; fill: white; filter: drop-shadow(0 5px 12px rgba(255, 77, 109, 0.25)); z-index: -1; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .days-value { font-size: 1.4rem; font-weight: 900; color: var(--pink); margin: 0; transform: translateY(-2px); }
        .label { font-size: 0.48rem; font-weight: 800; text-transform: uppercase; color: #777; line-height: 1.2; padding: 0 5px; }

        /* --- CARRUSEL --- */
        .carousel-container { 
            width: 100vw; height: 320px; z-index: 10; margin: 30px 0; overflow: hidden; 
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(3px); 
        }
        .carousel-track { display: flex; animation: scroll-slow 50s linear infinite; }
        .polaroid { background: white; padding: 10px 10px 25px 10px; margin: 0 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 200px; flex-shrink: 0; }
        .polaroid img { width: 100%; height: 200px; object-fit: cover; }
        @keyframes scroll-slow { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-230px * 10)); } }

        /* --- SPOTIFY --- */
        .spotify-container { margin: 0 auto; z-index: 20; width: 90%; max-width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        /* --- GENIALLY --- */
.genially-btn { 
    background: white; color: var(--pink); border: 2px solid var(--pink); padding: 14px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.15); transition: all 0.3s ease; /* Esta línea hace que el cambio de color sea suave */
    font-family: inherit;
}

/* ESTO ES LO QUE HACÍA FALTA: El efecto al pasar el mouse */
.genially-btn:hover { background: var(--pink); color: white; transform: translateY(-2px); /* Un pequeño salto hacia arriba para darle vida */ box-shadow: 0 6px 20px rgba(255, 77, 109, 0.3);
}

.genially-btn:active {
    transform: scale(0.95); /* Se hunde un poco al hacer clic */
}
        /* --- MURO (FECHA RECUPERADA) --- */
        #word-wall { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .static-word { 
            position: absolute; color: var(--pink); font-weight: bold; opacity: 0.3; 
            font-size: 1rem; pointer-events: auto; cursor: help; animation: float 8s infinite alternate;
        }
        .static-word:hover::after, .static-word:active::after {
            content: "🌻 " attr(data-date); position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%); background: #795548; color: white;
            padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; white-space: nowrap; z-index: 100;
        }
        @keyframes float { 0% { transform: translateY(0) rotate(var(--rot)); } 100% { transform: translateY(-15px) rotate(var(--rot)); } }

        /* --- FOOTER CENTRADO --- */
        .footer-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 20; margin-top: 10px; }
        .input-container { display: flex; width: 90%; max-width: 400px; gap: 5px; background: white; padding: 5px; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        input { border: none; padding: 10px 15px; border-radius: 50px; outline: none; flex: 1; font-size: 14px; }
        .send-btn { background: var(--pink); color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .unsubscribe-btn { background: none; border: none; color: #888; font-size: 11px; cursor: pointer; opacity: 0.6; text-decoration: underline; }

        .trail-flower { position: fixed; pointer-events: none; z-index: 9999; font-size: 20px; animation: fadeTrail 0.8s linear forwards; }
        @keyframes fadeTrail { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.2); } }
        #visor-fotos { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        #foto-grande { max-width: 90%; max-height: 80vh; border: 5px solid white; }
        #forever-overlay { display: none; position: fixed; inset: 0; background: var(--pink); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; text-align: center; padding: 30px; }
    </style>
</head>
<body>

    <div id="word-wall"></div>

    <h1>Ricky&Meli Love Page</h1>

    <div class="dashboard">
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-met">0</p>
            <p class="label">Días de<br>Conocernos</p>
        </div>
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-out">0</p>
            <p class="label">Días de la<br>1ra Cita</p>
        </div>
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-gf">0</p>
            <p class="label">Días de<br>Noviazgo</p>
        </div>
    </div>

    <div class="carousel-container">
        <div class="carousel-track">
            <div class="polaroid"><img src="https://i.postimg.cc/fWrMb98y/Foto1.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/fLbhzzXX/Foto3.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/g0mW7q2s/Foto2.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/N0pWP3V9/Foto9.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/7Pdy4yLM/Foto6.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/Qtzvjpjr/Foto10.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/mkvxy7nX/Foto5.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/J4XC4dD1/Foto7.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/nzwfMyGc/Foto4.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/gJqqBFN2/Foto11.jpg" onclick="abrirFoto(this.src)"></div>
        </div>
    </div>

    <div class="spotify-container">
        <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5Nf8YaO5XmmCXB0IovkS7v?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

    <div class="genially-box">
        <a href="https://view.genially.com/TU_LINK" target="_blank" style="text-decoration: none;">
            <button class="genially-btn">🎮 ¡A Jugar!</button>
        </a>
    </div>

    <div class="footer-wrapper">
        <div class="input-container">
            <input type="text" id="mensajeInput" placeholder="Añadir un recuerdo eterno...">
            <button class="send-btn" onclick="enviarMensaje()">Postear</button>
        </div>
        <button class="unsubscribe-btn" onclick="mostrarError()">Desuscribirse del servicio</button>
    </div>

    <div id="visor-fotos" onclick="cerrarFoto()"><img id="foto-grande" src=""></div>

    <div id="forever-overlay">
        <h2>ERROR 237</h2>
        <p>¡Patricia Fernández, venga para acá! Aquí nadie se baja del barco ❤️</p>
        <button onclick="cerrarError()" style="margin-top:20px; padding:10px 20px; border-radius: 20px; border: none; background: white; color: var(--pink); font-weight: bold;">Volver</button>
    </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWDuppxTJ0YH3PMgy8zERSsZ5CjRI2O-g",
  authDomain: "regalosanvalentin-488f4.firebaseapp.com",
  databaseURL: "https://regalosanvalentin-488f4-default-rtdb.firebaseio.com",
  projectId: "regalosanvalentin-488f4",
  storageBucket: "regalosanvalentin-488f4.firebasestorage.app",
  messagingSenderId: "606948409590",
  appId: "1:606948409590:web:93151713372f334eeb2cd7"
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const database = firebase.database();

function createTrail(x, y) {
    const trail = document.createElement('div');
    trail.className = 'trail-flower'; trail.innerHTML = '🌻';
    trail.style.left = x + 'px'; trail.style.top = y + 'px';
    document.body.appendChild(trail);
    setTimeout(() => trail.remove(), 800);
}
document.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
document.addEventListener('touchmove', (e) => createTrail(e.touches[0].clientX, e.touches[0].clientY), {passive: true});

function enviarMensaje() {
    const input = document.getElementById('mensajeInput');
    const texto = input.value.trim();
    if(!texto) return;
    const pass = prompt("Clave secreta:");
    if (pass === "CocacolaSprite") {
        const fecha = new Date().toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
        database.ref('muro').push({ texto, fecha, x: Math.random()*70+15, y: Math.random()*70+15 });
        input.value = '';
    } else { alert("Clave incorrecta 🌹"); }
}

database.ref('muro').on('child_added', (snap) => {
    const data = snap.val();
    const el = document.createElement('div');
    el.className = 'static-word';
    el.innerText = data.texto;
    // AQUÍ ESTÁ LA MAGIA: Reasignamos el atributo de fecha
    el.setAttribute('data-date', data.fecha || "Recuerdo eterno");
    el.style.left = data.x + '%'; el.style.top = data.y + '%';
    el.style.setProperty('--rot', (Math.random()*20-10)+'deg');
    document.getElementById('word-wall').appendChild(el);
});

function actualizarContadores() {
    const hoy = new Date();
    const diff = (f) => Math.floor((hoy - f) / (1000*60*60*24));
    document.getElementById('days-met').innerText = diff(new Date(2025, 6, 19)); 
    document.getElementById('days-out').innerText = diff(new Date(2025, 7, 23));
    document.getElementById('days-gf').innerText = diff(new Date(2025, 11, 7));
}
actualizarContadores();

function abrirFoto(src) { document.getElementById('foto-grande').src = src; document.getElementById('visor-fotos').style.display = 'flex'; }
function cerrarFoto() { document.getElementById('visor-fotos').style.display = 'none'; }
function mostrarError() { document.getElementById('forever-overlay').style.display = 'flex'; }
function cerrarError() { document.getElementById('forever-overlay').style.display = 'none'; }
</script>
</body>
</html>
