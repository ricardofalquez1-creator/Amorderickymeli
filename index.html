    <style>
        :root {
            --pink: #ff4d6d;
            --dark: #1a1a1a;
            --bg: #fff5f7;
            --glass: rgba(255, 255, 255, 0.7);
            --sunflower: #ffb700; /* Color girasol */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html { margin: 0; padding: 0; width: 100%; overflow-x: hidden; }

        body {
            padding: 20px 10px; min-height: 100vh;
            background: linear-gradient(-45deg, #fff5f7, #ffe0e9, #fff5f7, #ffccd5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 { color: var(--pink); font-size: 2rem; text-align: center; margin: 20px 0; font-weight: 900; z-index: 10; text-shadow: 2px 4px 6px rgba(0,0,0,0.05); }

        /* --- DASHBOARD --- */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 500px; z-index: 10; }
        .heart-clock { position: relative; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; animation: heartbeat 3s ease-in-out infinite; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .heart-shape { position: absolute; width: 100%; height: 100%; fill: white; filter: drop-shadow(0 5px 15px rgba(255, 77, 109, 0.2)); z-index: -1; }
        .days-value { font-size: 1.8rem; font-weight: 900; color: var(--pink); margin: 0; }
        .label { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #666; padding: 0 10px; }

        /* --- CARRUSEL --- */
        .carousel-container { width: 100vw; height: 250px; z-index: 10; margin: 30px 0; overflow: hidden; display: flex; align-items: center; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px); }
        .carousel-track { display: flex; animation: scroll-slow 40s linear infinite; }
        .polaroid { background: white; padding: 8px 8px 20px 8px; margin: 0 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-radius: 2px; flex-shrink: 0; width: 150px; transition: transform 0.3s; cursor: pointer; }
        .polaroid img { width: 100%; height: 150px; object-fit: cover; }
        @keyframes scroll-slow { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-170px * 10)); } }

        /* --- SPOTIFY --- */
        .spotify-container { margin: 10px 0; z-index: 20; width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.1); background: var(--glass); border: 1px solid rgba(255,255,255,0.4); }

        /* --- INPUT --- */
        .input-container { margin: 20px 0; display: flex; width: 90%; max-width: 400px; gap: 5px; z-index: 20; background: white; padding: 5px; border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        input { border: none; padding: 10px 15px; border-radius: 50px; outline: none; flex: 1; font-size: 14px; }
        .send-btn { background: var(--pink); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; }

        /* --- MURO DE PALABRAS --- */
        #word-wall { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .static-word { 
            position: absolute; color: var(--pink); font-weight: bold; opacity: 0.2; 
            font-size: 1rem; animation: floatAround 8s ease-in-out infinite alternate; 
            pointer-events: auto; cursor: help; 
        }
        /* Girasol en la fecha */
        .static-word:hover::after {
            content: "🌻 " attr(data-date); 
            position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%); background: #795548; color: white;
            padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; white-space: nowrap; z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        @keyframes floatAround { 0% { transform: translateY(0px) rotate(var(--rot)); } 100% { transform: translateY(-20px) rotate(var(--rot)); } }

        /* --- TRAIL GIRASOL --- */
        .trail-flower { 
            position: fixed; 
            pointer-events: none; 
            z-index: 9999; 
            font-size: 20px; /* Tamaño del girasol */
            animation: fadeTrail 0.8s linear forwards; 
            user-select: none;
        }

        @keyframes fadeTrail { 
            0% { 
            opacity: 1; 
            transform: translate(-50%, -50%) scale(0.6) rotate(0deg); 
        } 
            100% { 
            opacity: 0; 
            transform: translate(-50%, -150%) scale(1.2) rotate(90deg); 
            } 
        }

        /* --- ERROR 237 --- */
        #forever-overlay { display: none; position: fixed; inset: 0; background: var(--pink); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; text-align: center; padding: 30px; }
        .unsubscribe-btn { background: none; border: none; color: #bbb; font-size: 10px; cursor: pointer; opacity: 0.5; margin: 20px 0; z-index: 20; }
        
        #visor-fotos { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        #foto-grande { max-width: 95%; max-height: 80vh; border: 4px solid white; }
    </style>

}
const database = firebase.database();

// --- El resto de tu código (createTrail, enviarMensaje, etc.) se queda IGUAL ---

    // RASTRO DE GIRASOLES CORREGIDO
    function createTrail(x, y) {
        const trail = document.createElement('div');
        trail.className = 'trail-flower'; // Asegúrate que coincida con el CSS
        trail.innerHTML = '🌻';
        trail.style.left = x + 'px'; 
        trail.style.top = y + 'px';
        document.body.appendChild(trail);
    
        // Limpieza automática para que no sature la memoria
        setTimeout(() => {
            if (trail.parentNode) {
                trail.remove();
        }
            }, 800);
        }

        // Eventos para PC y Móvil
        document.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => {
        createTrail(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: true});
    
function enviarMensaje() {
    const input = document.getElementById('mensajeInput');
    const texto = input.value.trim();
    
    if(texto === "") return;
    
    const password = prompt("Clave secreta:");
    
    // La clave se valida aquí en tu página. Si es correcta, envía los datos.
    if (password === "CocacolaSprite") {
        const ahora = new Date().toLocaleDateString('es-ES', { 
            day:'numeric', month:'long', year:'numeric' 
        });

        database.ref('muro').push({
            texto: texto,
            fecha: ahora,
            x: Math.random() * 70 + 15,
            y: Math.random() * 70 + 15
        }).then(() => {
            input.value = '';
            alert("¡Mensaje guardado! ✨");
        }).catch((error) => {
            alert("Hubo un error al conectar con Firebase.");
        });
    } else { 
        alert("Clave incorrecta 🌹"); 
    }
}
    
database.ref('muro').on('child_added', (snapshot) => {
    const data = snapshot.val();
    
    // Verificamos que los datos existan antes de intentar crearlos
    if (data && data.texto) {
        const el = document.createElement('div');
        el.className = 'static-word';
        el.innerText = data.texto;
        
        // Usamos la fecha guardada, o un mensaje por defecto si no tiene
        el.setAttribute('data-date', data.fecha || "Recuerdo eterno");
        
        // Posicionamiento aleatorio guardado
        el.style.left = data.x + '%'; 
        el.style.top = data.y + '%';
        
        // Rotación aleatoria visual
        el.style.setProperty('--rot', (Math.random() * 20 - 10) + 'deg');
        
        document.getElementById('word-wall').appendChild(el);
    }
});

    function actualizarContadores() {
        const hoy = new Date();
        const diff = (f) => Math.floor((hoy - f) / (1000 * 60 * 60 * 24));
        document.getElementById('days-met').innerText = diff(new Date(2025, 7, 19));
        document.getElementById('days-out').innerText = diff(new Date(2025, 8, 23));
        document.getElementById('days-gf').innerText = diff(new Date(2025, 11, 7));
    }
    actualizarContadores();
    function abrirFoto(src) { document.getElementById('foto-grande').src = src; document.getElementById('visor-fotos').style.display = 'flex'; }
    function cerrarFoto() { document.getElementById('visor-fotos').style.display = 'none'; }
    function mostrarError() { document.getElementById('forever-overlay').style.display = 'flex'; }
    function cerrarError() { document.getElementById('forever-overlay').style.display = 'none'; }
</script>
