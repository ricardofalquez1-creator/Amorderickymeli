<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ricky&Meli Love Page</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --pink: #ff4d6d;
            --dark: #1a1a1a;
            --bg: #fff5f7;
            --glass: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html { 
            margin: 0; padding: 0; width: 100%; 
            overflow-x: hidden; /* Vital para móviles */
        }

        body {
            padding: 20px 10px; min-height: 100vh;
            background: linear-gradient(-45deg, #fff5f7, #ffe0e9, #fff5f7, #ffccd5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            color: var(--pink); font-size: 2rem; text-align: center;
            margin: 20px 0; font-weight: 900; z-index: 10;
            text-shadow: 2px 4px 6px rgba(0,0,0,0.05);
        }

        /* --- DASHBOARD RESPONSIVO --- */
        .dashboard { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; width: 100%; max-width: 500px; z-index: 10; 
        }

        .heart-clock { 
            position: relative; aspect-ratio: 1/1;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; animation: heartbeat 3s ease-in-out infinite; 
        }

        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        .heart-shape { position: absolute; width: 100%; height: 100%; fill: white; filter: drop-shadow(0 5px 15px rgba(255, 77, 109, 0.2)); z-index: -1; }
        
        .days-value { font-size: 1.8rem; font-weight: 900; color: var(--pink); margin: 0; }
        .label { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #666; padding: 0 10px; }

        /* --- CARRUSEL TÁCTIL --- */
        .carousel-container { 
            width: 100vw; height: 250px; z-index: 10; margin: 30px 0; 
            overflow: hidden; display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px);
        }
        .carousel-track { display: flex; animation: scroll-slow 40s linear infinite; }
        
        .polaroid { 
            background: white; padding: 8px 8px 20px 8px; margin: 0 10px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-radius: 2px; 
            flex-shrink: 0; width: 150px; transition: transform 0.3s;
        }
        .polaroid img { width: 100%; height: 150px; object-fit: cover; }

        @keyframes scroll-slow { 0% { transform: translateX(0); } 100% { transform: translateX(calc(-170px * 10)); } }

        /* --- SPOTIFY --- */
        .spotify-container { 
            margin: 10px 0; z-index: 20; width: 100%; max-width: 400px; 
            border-radius: 15px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.1); 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.4);
        }

        .play-btn { 
            background: linear-gradient(135deg, #6e45e2 0%, #5d3fd3 100%);
            color: white; border: none; padding: 15px 30px; border-radius: 50px; 
            font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; 
            margin: 20px 0; z-index: 20; box-shadow: 0 10px 20px rgba(93, 63, 211, 0.3);
            text-align: center; width: 80%; max-width: 300px;
        }

        /* --- INPUTS --- */
        .input-container { 
            margin: 20px 0; display: flex; width: 90%; max-width: 400px;
            gap: 5px; z-index: 20; background: white; padding: 5px; border-radius: 50px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
        }
        input { border: none; padding: 10px 15px; border-radius: 50px; outline: none; flex: 1; font-size: 14px; min-width: 0; }
        .send-btn { background: var(--pink); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 13px; }

        /* --- MURO --- */
        #word-wall { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .static-word { position: absolute; color: var(--pink); font-weight: bold; opacity: 0.15; font-size: 1rem; animation: floatAround 8s ease-in-out infinite alternate; }
        
        @keyframes floatAround { 0% { transform: translateY(0px) rotate(var(--rot)); } 100% { transform: translateY(-20px) rotate(var(--rot)); } }

        /* --- TRAIL & PARTICLES --- */
        .trail-heart { position: fixed; pointer-events: none; z-index: 9999; color: var(--pink); font-size: 12px; animation: fadeTrail 0.8s linear forwards; }
        @keyframes fadeTrail { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -100%) scale(0.5); } }

        #visor-fotos { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; }
        #foto-grande { max-width: 95%; max-height: 80vh; border: 4px solid white; }

        /* AJUSTES PARA PANTALLAS MUY PEQUEÑAS */
        @media (max-width: 360px) {
            h1 { font-size: 1.6rem; }
            .days-value { font-size: 1.5rem; }
            .polaroid { width: 130px; }
        }
    </style>
</head>
<body>

    <div id="word-wall"></div>

    <h1>Ricky&Meli Love Page</h1>

    <div class="dashboard">
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-met">0</p>
            <p class="label">Desde el inicio</p>
        </div>
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-out">0</p>
            <p class="label">Primera Cita</p>
        </div>
        <div class="heart-clock">
            <svg class="heart-shape" viewBox="0 0 32 29.6"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
            <p class="days-value" id="days-gf">0</p>
            <p class="label">Novios</p>
        </div>
    </div>

    <div class="carousel-container">
        <div class="carousel-track">
            <div class="polaroid"><img src="https://i.postimg.cc/fWrMb98y/Foto1.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/fLbhzzXX/Foto3.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/g0mW7q2s/Foto2.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/N0pWP3V9/Foto9.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/7Pdy4yLM/Foto6.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/Qtzvjpjr/Foto10.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/mkvxy7nX/Foto5.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/J4XC4dD1/Foto7.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/nzwfMyGc/Foto4.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/gJqqBFN2/Foto11.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/fWrMb98y/Foto1.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/fLbhzzXX/Foto3.jpg" onclick="abrirFoto(this.src)"></div>
            <div class="polaroid"><img src="https://i.postimg.cc/g0mW7q2s/Foto2.jpg" onclick="abrirFoto(this.src)"></div>
        </div>
    </div>

    <a href="https://view.genially.com/6991621c3d6d6d7dbf5e93a7/interactive-content-reto-8bits" target="_blank" class="play-btn">🎮 JUGAR NUESTRO JUEGO</a>

    <div class="spotify-container">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1EId6mR4jWpL17?utm_source=generator" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
    
    <div class="input-container">
        <input type="text" id="mensajeInput" placeholder="Recuerdo especial...">
        <button class="send-btn" onclick="enviarMensaje()">Postear</button>
    </div>

    <div id="visor-fotos" onclick="cerrarFoto()"><img id="foto-grande" src=""></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAWDuppxTJ0YH3PMgy8zERSsZ5CjRI2O-g",
        authDomain: "regalosanvalentin-488f4.firebaseapp.com",
        databaseURL: "https://regalosanvalentin-488f4-default-rtdb.firebaseio.com",
        projectId: "regalosanvalentin-488f4",
        storageBucket: "regalosanvalentin-488f4.firebasestorage.app",
        messagingSenderId: "606948409590",
        appId: "1:606948409590:web:93151713372f334eeb2cd7"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- RASTRO ADAPTADO A MÓVIL (Touch) ---
    function createTrail(x, y) {
        const trail = document.createElement('div');
        trail.className = 'trail-heart';
        trail.innerHTML = '💖';
        trail.style.left = x + 'px';
        trail.style.top = y + 'px';
        document.body.appendChild(trail);
        setTimeout(() => trail.remove(), 800);
    }

    document.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
    document.addEventListener('touchmove', (e) => {
        createTrail(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: true});

    function enviarMensaje() {
        const input = document.getElementById('mensajeInput');
        if(input.value.trim() === "") return;
        const password = prompt("Introduce la clave:");
        if (password === "CocacolaSprite") {
            database.ref('muro').push({ texto: input.value, x: Math.random() * 70 + 15, y: Math.random() * 70 + 15 });
            input.value = '';
        } else { alert("Clave incorrecta 🌹"); }
    }

    database.ref('muro').on('child_added', (snapshot) => {
        const data = snapshot.val();
        if(data && data.texto) {
            const el = document.createElement('div');
            el.className = 'static-word';
            el.innerText = data.texto;
            el.style.left = data.x + '%'; el.style.top = data.y + '%';
            el.style.setProperty('--rot', (Math.random() * 20 - 10) + 'deg');
            document.getElementById('word-wall').appendChild(el);
        }
    });

    function actualizarContadores() {
        const hoy = new Date();
        const diff = (f) => Math.floor((hoy - f) / (1000 * 60 * 60 * 24));
        document.getElementById('days-met').innerText = diff(new Date(2025, 7, 19));
        document.getElementById('days-out').innerText = diff(new Date(2025, 8, 23));
        document.getElementById('days-gf').innerText = diff(new Date(2025, 11, 7));
    }
    actualizarContadores();

    function abrirFoto(src) { document.getElementById('foto-grande').src = src; document.getElementById('visor-fotos').style.display = 'flex'; }
    function cerrarFoto() { document.getElementById('visor-fotos').style.display = 'none'; }
</script>
</body>
</html>
